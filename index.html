<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body class="antialiased text-slate-800 bg-slate-50">
    <!-- NAVBAR -->
    <header
      class="sticky top-0 z-50 bg-[#f9fafb] border-b border-slate-200 shadow-sm"
    >
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex items-center justify-between h-16">
          <div class="flex items-center gap-6">
            <a href="#home" class="flex items-center gap-2 group">
              <div
                class="w-10 h-10 rounded-lg bg-gradient-to-tr from-green-500 to-purple-600 flex items-center justify-center text-white font-bold shadow-sm group-hover:scale-105 transition-transform"
              >
                GFG
              </div>
              <div class="hidden sm:block">
                <div class="text-lg font-semibold text-slate-800">
                  GeeksforGeeks<span class="text-green-500">Jobs</span>
                </div>
                <div class="text-xs text-slate-500 -mt-0.5">
                  Jobs . Hiring . Careers
                </div>
              </div>
            </a>

            <nav
              class="hidden lg:flex items-center gap-4 text-sm font-medium text-slate-600"
            >
              <a
                href="#home"
                class="py-2 px-3 rounded hover:text-indigo-600 hover:bg-indigo-50"
                >Home</a
              >

              <a
                href="#available"
                class="py-2 px-3 rounded hover:text-indigo-600 hover:bg-indigo-50"
                >Available Jobs</a
              >

              <a
                href="#jobs-listing"
                class="py-2 px-3 rounded hover:text-indigo-600 hover:bg-indigo-50"
                >Jobs listing</a
              >

              <a
                href="#popular-jobs"
                class="py-2 px-3 rounded hover:text-indigo-600 hover:bg-indigo-50"
                >Popular Jobs</a
              >
            </nav>
          </div>

          <div class="flex items-center gap-3">
            <button
              id="openPostJob"
              class="hidden md:inline-flex items-center gap-2 px-4 py-2 rounded-md border border-indigo-600 text-indigo-600 text-sm font-medium hover:bg-indigo-50 transition"
            >
              <svg
                class="w-4 h-4"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
              >
                <path
                  d="M12 5v14M5 12h14"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
              Post Job
            </button>

            <button
              id="loginRecruiterBtn"
              class="hidden lg:inline px-4 py-2 text-sm font-medium rounded-md border border-slate-300 text-slate-700 hover:bg-slate-100 transition"
            >
              Recruiter Login
            </button>

            <button
              id="loginSeekerBtn"
              class="px-4 py-2 text-sm font-medium rounded-md bg-indigo-600 text-white hover:bg-indigo-700 shadow-sm transition"
            >
              Job Seeker
            </button>

            <button
              id="mobileBtn"
              class="ml-2 inline-flex items-center justify-center p-2 rounded-md text-slate-600 hover:bg-slate-200 lg:hidden"
            >
              <svg
                class="w-6 h-6"
                fill="none"
                stroke="currentColor"
                viewBox="0 0 24 24"
              >
                <path
                stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M4 6h16M4 12h16M4 18h16"
                />
              </svg>
            </button>
          </div>
        </div>
      </div>
    </header>

<section id="home" class="relative min-h-[90vh] flex items-center bg-gradient-to-br from-indigo-600 via-sky-600 to-blue-500 text-white overflow-hidden"
>
<div class="absolute inset-0 opacity-30 bg-[radial-gradient(ellipse_at_top_right,var(--tw-gradient-stops))] from-cyan-400 via-indigo-400 to-transparent blur-3xl"
></div>

<div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 relative z-10 w-full">
  <div>
    <h1 class="text-4xl sm:text-5xl font-extrabold leading-tight text-white drop-shadow-lg">
      Find Your  <span class="text-yellow-300">Dream Jobs</span> Today

    </h1>
    <p class="mt-4 text-indigo-100 text-lg max-w-xl sm:text-xl text-white/90 drop-shadow">
      Explore thousands of job opportunities with all the information you need. It's your future. Come find it.
    </p>

    <form
    id="heroSearch"
    class="mt-8 bg-white/20 backdrop-blur-md border border-white/30 p-4 rounded-xl shadow-lg flex flex-col sm:flex-row gap-3 items-center">

    <input
    id="q"
    class="flex-1 w-full px-4 py-3 bg-white/90 rounded-md text-gray-800 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-yellow-300"
    placeholder="Search by job title, skills, or company..."
    />

    <input
    id="location"
    class="w-full sm:w-52 px-4 py-3 bg-white/90 rounded-md text-gray-800 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-yellow-300"
    placeholder="Location"
    />

    <button
    type="submit"
    class="w-full sm:w-auto px-6 py-3 rounded-md bg-yellow-400 text-gray-900 font-semibold hover:bg-yellow-300 transition-all shadow-md hover:shadow-lg"
    >
      Search Jobs
    </button>
      
  </form>
  </div>
</div>


</section>
  </body>
</html>
