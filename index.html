<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body class="antialiased text-slate-800 bg-slate-50">
    <!-- NAVBAR -->
    <header
      class="sticky top-0 z-50 bg-[#f9fafb] border-b border-slate-200 shadow-sm"
    >
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex items-center justify-between h-16">
          <!-- LOGO -->
          <div class="flex items-centre g-6">
            <a href="#home" class="flex items-center gap-2 group">
              <div
                class="w-10 h-10 rounded-lg bg-gradient-to-tr from-green-500 to-purple-600 flex items-center justify-center text-white font-bold shadow-sm group-hover:scale-105 transition-transform"
              >
                GFG
              </div>
              <div class="hidden sm:block">
                <div class="text-lg font-semibold text-slate-800">
                  GeeksforGeeks<span class="text-green-500">Jobs</span>
                </div>
                <div class="text-xs text-slate-500 -mt-0.5">
                  Jobs . Hiring . Careers
                </div>
              </div>
            </a>

            <!-- NAVLINKS -->
            <nav
              class="hidden lg:flex items-center gap-4 text-sm font-medium text-slate-600"
            >
              <a
                href="#home"
                class="py-2 px-3 rounded hover:text-indigo-600 hover:bg-indigo-50"
                >Home</a
              >

                <a
                href="#available"
                class="py-2 px-3 rounded hover:text-indigo-600 hover:bg-indigo-50"
                >Available Jobs</a
              >

                <a
                href="#jobs-listing"
                class="py-2 px-3 rounded hover:text-indigo-600 hover:bg-indigo-50"
                >Jobs listing</a
              >

                <a
                href="#popular-jobs"
                class="py-2 px-3 rounded hover:text-indigo-600 hover:bg-indigo-50"
                >Popular Jobs</a
              >

            </nav>
          </div>

          <!-- button -->
           <div class="flex items-centre gap-3">
<button id="openPostJob" class="hidden md:inline-flex items-centre gap-2 px-4 py-2 rounded-md border border-indigo-600 text-indigo-600 text-sm font-medium hover:bg-indigo-50 transition">
  <svg
   class="w-4 h-4"
</button>
           </div>
        </div>
      </div>
    </header>
  </body>
</html>
